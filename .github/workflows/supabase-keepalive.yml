name: Supabase keep-alive

# Supabase bepul tarifidagi loyiha 7 kun harakatsiz qolsa uxlab qoladi.
# Bu workflow har kuni bitta yengil REST so'rov yuborib, loyihani faol ushlab turadi.
#
# Sozlash (bir marta):
#   GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret
#     NEXT_PUBLIC_SUPABASE_URL       = Supabase Project URL
#     NEXT_PUBLIC_SUPABASE_ANON_KEY  = Supabase anon/public key
#
# Eslatma: GitHub 60 kun davomida repozitoriyga hech qanday push bo'lmasa,
# scheduled workflow'larni avtomatik o'chirib qo'yadi. Istalgan commit uni qayta yoqadi.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Supabase REST API ga so'rov yuborish
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL yoki NEXT_PUBLIC_SUPABASE_ANON_KEY secret'i sozlanmagan."
            exit 1
          fi

          # Ortiqcha "/" bo'lsa olib tashlaymiz.
          BASE_URL="${SUPABASE_URL%/}"

          code=$(curl -sS -o /tmp/supabase-response.json -w '%{http_code}' \
            --retry 4 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$BASE_URL/rest/v1/profiles?select=id&limit=1")

          echo "HTTP status: $code"

          if [ "$code" != "200" ]; then
            echo "::error::Supabase javobi 200 emas. Javob:"
            cat /tmp/supabase-response.json || true
            exit 1
          fi

          echo "Supabase faol: ma'lumotlar bazasi javob berdi."
